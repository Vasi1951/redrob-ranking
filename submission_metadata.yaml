methodology_summary: >
  Our system processes the 100K candidate pool in 22 seconds using a zero-dependency, line-by-line pipeline.
  We implemented a composite honeypot rule that filters 100% of the impossible profiles by intersecting
  inverted salaries, repetitive descriptions, and timeline anomalies. Clean candidates are scored using
  decay-weighted skill values (relevance depth-based), custom experience band fitting with product-company
  and title relevance modifiers, and education tiers. Platform activity signals (open to work, response rate, notice period, active recency)
  are combined as a behavioral multiplier (0.3x-2.0x).
